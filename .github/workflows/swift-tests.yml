# This workflow validates both the core package tests and a non-signing app build.

name: Swift Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: swift-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run VoceKit tests
        env:
          CLANG_MODULE_CACHE_PATH: /tmp/voce-clang-cache
          SWIFT_MODULECACHE_PATH: /tmp/voce-swift-cache
        run: |
          cd VoceKit
          swift test

      - name: Build macOS app (no signing)
        run: |
          xcodebuild build \
            -project Voce.xcodeproj \
            -scheme Voce \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # Explicitly report the verified result so manually dispatched release
      # runs satisfy the protected branch even when check rollup is missing.
      - name: Report required test status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$CI_JOB_STATUS" == "success" ]]; then
            state=success
            description="VoceKit tests and macOS build passed"
          else
            state=failure
            description="VoceKit tests or macOS build did not pass"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CI_HEAD_SHA" \
            -f state="$state" \
            -f context=test \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
